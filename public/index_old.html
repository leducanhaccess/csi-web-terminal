<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>CSI TX/RX Web Terminal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101114;
      color: #eee;
      padding: 18px;
    }

    .panel {
      background: #181a20;
      border: 1px solid #333842;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    input, select, button {
      padding: 8px;
      margin: 4px;
      border-radius: 6px;
      border: 1px solid #555;
    }

    input, select {
      background: #222631;
      color: #eee;
    }

    button {
      background: #2e6eea;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #1f55bd;
    }

    .danger {
      background: #bd3d3d;
    }

    #notify {
      display: none;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .success {
      background: #143d1f;
      color: #b7ffca;
    }

    .error {
      background: #4a1414;
      color: #ffcaca;
    }

    .info {
      background: #18324a;
      color: #c9e6ff;
    }

    #terminal {
      background: #000;
      color: #00ff66;
      height: 380px;
      overflow-y: auto;
      white-space: pre-wrap;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      font-family: Consolas, monospace;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    th, td {
      border: 1px solid #333842;
      padding: 8px;
      text-align: left;
    }

    a {
      color: #8ab4ff;
    }

    .offline { color: #aaa; }
    .online { color: #94c9ff; }
    .configured { color: #aaffc2; }
    .capturing { color: #ffe08a; }
    .errorStatus { color: #ff9a9a; }
  </style>
</head>
<body>
  <h1>CSI TX/RX Web Terminal</h1>

  <div id="notify"></div>

  <div class="panel">
    <b>Interface cố định:</b> eth6. Client không được chỉnh.
  </div>

  <div class="grid">
    <div class="panel">
      <h2>TX Control</h2>

      <input id="txIp" placeholder="TX IP" value="192.168.1.10">
      <input id="txHost" placeholder="TX hostname" value="tx">
      <input id="txUser" placeholder="TX username" value="admin">
      <input id="txPass" placeholder="TX password" type="password">

      <br>

      <input id="txChannel" placeholder="TX channel" value="157">

      <select id="txBandwidth">
        <option value="20">20 MHz</option>
        <option value="40">40 MHz</option>
        <option value="80" selected>80 MHz</option>
      </select>

      <br>

      <button onclick="txTest()">Test SSH TX</button>
      <button onclick="txConfigure()">Configure TX Wi-Fi</button>
      <button onclick="txAction('init')">Init TX</button>
      <button onclick="txAction('start')">Start TX</button>
      <button onclick="txAction('stop')">Stop TX</button>
      <button class="danger" onclick="txAction('deinit')">Deinit TX</button>
    </div>

    <div class="panel">
      <h2>RX Global Config</h2>

      <input id="rxChannel" placeholder="RX channel" value="157">

      <select id="rxBandwidth">
        <option value="20">20 MHz</option>
        <option value="40">40 MHz</option>
        <option value="80" selected>80 MHz</option>
      </select>

      <select id="rxCore">
        <option value="1" selected>Core 1</option>
        <option value="2">Core 2</option>
        <option value="3">Core 3</option>
        <option value="4">Core 4</option>
      </select>

      <select id="rxStream">
        <option value="1" selected>Stream 1</option>
        <option value="2">Stream 2</option>
        <option value="3">Stream 3</option>
        <option value="4">Stream 4</option>
      </select>

      <input id="duration" placeholder="Capture duration seconds" value="10">

      <br>

      <button onclick="rxTest()">Test SSH 3 RX</button>
      <button onclick="rxConfigure()">Configure 3 RX</button>
      <button onclick="rxCapture()">Start Capture</button>
      <button onclick="rxFetch()">Fetch + Zip PCAP</button>
    </div>
  </div>

  <div class="panel">
    <h2>RX Devices</h2>

    <table>
      <thead>
        <tr>
          <th>RX</th>
          <th>IP</th>
          <th>Hostname</th>
          <th>User</th>
          <th>Password</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>RX1</td>
          <td><input id="rx1Ip" value="192.168.1.101"></td>
          <td><input id="rx1Host" value="rx1"></td>
          <td><input id="rx1User" value="admin"></td>
          <td><input id="rx1Pass" type="password"></td>
          <td id="status-rx1" class="offline">offline</td>
        </tr>

        <tr>
          <td>RX2</td>
          <td><input id="rx2Ip" value="192.168.1.102"></td>
          <td><input id="rx2Host" value="rx2"></td>
          <td><input id="rx2User" value="admin"></td>
          <td><input id="rx2Pass" type="password"></td>
          <td id="status-rx2" class="offline">offline</td>
        </tr>

        <tr>
          <td>RX3</td>
          <td><input id="rx3Ip" value="192.168.1.103"></td>
          <td><input id="rx3Host" value="rx3"></td>
          <td><input id="rx3User" value="admin"></td>
          <td><input id="rx3Pass" type="password"></td>
          <td id="status-rx3" class="offline">offline</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="panel">
    <h2>Capture Files</h2>
    <input id="captureId" placeholder="Capture ID">
    <div id="downloadArea"></div>
  </div>

  <h2>Backend Terminal</h2>
  <div id="terminal"></div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();
    const terminal = document.getElementById("terminal");
    const notifyBox = document.getElementById("notify");
    const downloadArea = document.getElementById("downloadArea");

    function v(id) {
      return document.getElementById(id).value;
    }

    socket.on("terminal-log", msg => {
      terminal.textContent += msg;
      terminal.scrollTop = terminal.scrollHeight;
    });

    socket.on("notify", data => {
      notifyBox.style.display = "block";
      notifyBox.className = data.type;
      notifyBox.textContent = data.message;
    });

    socket.on("capture-id", id => {
      document.getElementById("captureId").value = id;
    });

    socket.on("pcap-ready", data => {
      let html = `<p><b>Capture ID:</b> ${data.captureId}</p>`;
      html += `<a href="${data.zipUrl}" download>Download ZIP</a>`;
      html += "<h3>Individual PCAP</h3>";

      for (const link of data.pcapLinks) {
        html += `<a href="${link}" download>${link}</a><br>`;
      }

      downloadArea.innerHTML = html;
    });

    socket.on("state", data => {
      for (const [name, st] of Object.entries(data.rxState)) {
        const el = document.getElementById(`status-${name}`);
        if (!el) continue;

        el.className = st.status === "error" ? "errorStatus" : st.status;
        el.textContent = `${st.status}${st.message ? " | " + st.message : ""}`;
      }
    });

    function txConfig() {
      return {
        ip: v("txIp"),
        hostname: v("txHost"),
        username: v("txUser"),
        password: v("txPass"),
        authMode: "password",
        keyPath: "",
        channel: v("txChannel"),
        bandwidth: v("txBandwidth")
      };
    }

    function rxDevice(n) {
      return {
        ip: v(`rx${n}Ip`),
        hostname: v(`rx${n}Host`),
        username: v(`rx${n}User`),
        password: v(`rx${n}Pass`),
        authMode: "password",
        keyPath: ""
      };
    }

    function rxList() {
      return [rxDevice(1), rxDevice(2), rxDevice(3)];
    }

    function rxConfig() {
      return {
        channel: v("rxChannel"),
        bandwidth: v("rxBandwidth"),
        core: v("rxCore"),
        stream: v("rxStream"),
        duration: v("duration"),
        rxList: rxList()
      };
    }

    function txTest() {
      socket.emit("tx-test", txConfig());
    }

    function txConfigure() {
      socket.emit("tx-configure", txConfig());
    }

    function txAction(action) {
      socket.emit("tx-action", {
        ...txConfig(),
        action
      });
    }

    function rxTest() {
      socket.emit("rx-test", {
        rxList: rxList()
      });
    }

    function rxConfigure() {
      socket.emit("rx-configure", rxConfig());
    }

    function rxCapture() {
      socket.emit("rx-capture", rxConfig());
    }

    function rxFetch() {
      socket.emit("rx-fetch", {
        captureId: v("captureId"),
        duration: v("duration"),
        rxList: rxList()
      });
    }
  </script>
</body>
</html>
